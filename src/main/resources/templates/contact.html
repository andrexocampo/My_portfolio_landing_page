<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Contact Me - My Portfolio')}">
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <!-- Contact Header -->
    <div class="project-header-container">
        <div class="container py-2">
            <div class="project-header-card">
                <div class="row align-items-center">
                    <div class="col-12">
                        <h1 class="project-header-title mb-3">Contact Me</h1>
                        <p class="project-header-subtitle">Get in touch with me</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Contact Content -->
    <div class="container mt-4 mb-5">
        <div class="row">
            <!-- Contact Information -->
            <div class="col-md-6 mb-4">
                <div class="card problem-intro-card h-100">
                    <div class="card-body p-4">
                        <h2 class="about-section-title mb-4">Contact Information</h2>
                        
                        <div class="contact-info-item mb-4">
                            <h4 class="contact-info-label mb-2">Email</h4>
                            <p class="mb-0">[your.email@example.com]</p>
                        </div>
                        
                        <div class="contact-info-item mb-4">
                            <h4 class="contact-info-label mb-2">Phone</h4>
                            <p class="mb-0">[+1 (123) 456-7890]</p>
                        </div>
                        
                        <div class="contact-info-item mb-4">
                            <h4 class="contact-info-label mb-2">Location</h4>
                            <p class="mb-0">[Your City, Country]</p>
                        </div>
                        
                        <div class="contact-info-item">
                            <h4 class="contact-info-label mb-2">Social Media</h4>
                            <div class="contact-social-links">
                                <a href="#" class="contact-social-link me-3">LinkedIn</a>
                                <a href="#" class="contact-social-link me-3">GitHub</a>
                                <a href="#" class="contact-social-link">Twitter</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Contact Form -->
            <div class="col-md-6 mb-4">
                <div class="card problem-intro-card h-100">
                    <div class="card-body p-4">
                        <h2 class="about-section-title mb-4">Send a Message</h2>
                        
                        <form class="contact-form">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" placeholder="Your name">
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="your.email@example.com">
                            </div>
                            
                            <div class="mb-3">
                                <label for="subject" class="form-label">Subject</label>
                                <input type="text" class="form-control" id="subject" placeholder="Message subject">
                            </div>
                            
                            <div class="mb-3">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" rows="5" placeholder="Your message"></textarea>
                            </div>
                            
                            <button type="submit" class="btn btn-view-more">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <!-- Bootstrap JS -->
    <div th:replace="~{fragments/scripts :: bootstrap-scripts}"></div>
</body>
</html>
