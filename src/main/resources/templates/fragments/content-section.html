<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- 
        Fragment for alternating content sections
        Parameters:
        - imageSrc: Path to the image
        - imageAlt: Alt text for the image
        - content: HTML content
        - imagePosition: 'left' or 'right'
        - sectionClass: Additional CSS class for styling
    -->
    <div th:fragment="contentSection(imageSrc, imageAlt, content, imagePosition, sectionClass)"
         th:classappend="${sectionClass != null ? sectionClass : ''}"
         class="content-section mb-5 py-4">
        <div class="container">
            <div class="row align-items-center" th:classappend="${imagePosition == 'right'} ? 'flex-row-reverse' : ''">
                <!-- Image -->
                <div class="col-md-5 mb-4 mb-md-0">
                    <img th:src="@{${imageSrc}}" 
                         th:alt="${imageAlt}" 
                         class="content-section-image w-100" />
                </div>
                
                <!-- Content -->
                <div class="col-md-7">
                    <div class="content-section-text" th:utext="${content}"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
