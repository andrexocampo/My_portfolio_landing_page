<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('My Portfolio - Home')}">
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <!-- Banner -->
    <div class="banner-container">
        <h1 id="titulo-banner">Portfolio</h1>
        <div class="banner"> 
            <img th:src="@{/images/Tren.jpg}" class="my_cover" alt="Main banner">
        </div>
    </div>
    
    <!-- Main content -->
    <div class="container mt-4" id="home">
        <div class="row">
            <div class="col-md-3">
                <img th:src="@{/images/lily-3520837_1280(1).jpg}" class="imagen1" alt="About me image">
            </div>
            <div class="col-md-8 card">
                <p>some text</p>
            </div>
        </div>
        
        <div class="row" id="information2">
            <div class="col-md-6">
                <h2>Skills Summary</h2>
                <p>
                    Some placeholder text that you can replace with your actual skills and experience.
                    This section can describe your technical abilities, programming languages, frameworks,
                    and other professional competencies.
                </p>
            </div>
        </div>
        
        <!-- Project Section - Example using fragment -->
        <div th:replace="~{fragments/project-section :: project(
            'Project Title',
            '<p>Some project description text here...</p>',
            '/images/balcon2.jpg',
            'Project image',
            'right',
            false
        )}"></div>
    </div>
    
    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
